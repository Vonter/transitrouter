name: Process GTFS Feeds

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      city:
        description: City to process
        required: false
        type: choice
        default: all
        options:
          - all
          - ahmedabad
          - blr
          - hublidharwad
          - mumbai
          - pune
          - rajkot
          - karnataka
          - railways
          - andhrapradesh
      generate_pois:
        description: Also generate points of interest (POIs)
        required: false
        type: boolean
        default: false
      force_reprocess:
        description: Force re-parse even if the GTFS hash is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gtfs
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine cities to process
        id: cities
        env:
          REQUESTED_CITY: ${{ inputs.city }}
        run: |
          configured=$(python3 -c "import json; print(' '.join(json.load(open('sources.json')).keys()))")
          if [ -n "$REQUESTED_CITY" ] && [ "$REQUESTED_CITY" != "all" ]; then
            if ! echo " $configured " | grep -q " $REQUESTED_CITY "; then
              echo "::error::City '$REQUESTED_CITY' has no GTFS source configured in sources.json (configured: $configured)"
              exit 1
            fi
            cities="$REQUESTED_CITY"
          else
            cities="$configured"
          fi
          echo "list=$cities" >> "$GITHUB_OUTPUT"
          echo "Cities to process: $cities"

      - name: Fetch and process GTFS feeds
        run: python3 process.py ${{ steps.cities.outputs.list }} ${{ inputs.generate_pois == true && '' || '--skip-pois' }} ${{ inputs.force_reprocess == true && '--force-reprocess' || '' }}

      - name: Detect changed cities
        id: detect-changes
        working-directory: ${{ github.workspace }}
        run: |
          changed=""
          for city in ${{ steps.cities.outputs.list }}; do
            schedule_dir="data/$city/schedule"
            if [ -d "$schedule_dir" ] && [ -n "$(ls -A "$schedule_dir" 2>/dev/null)" ]; then
              changed="$changed $city"
            fi
          done
          changed="$(echo "$changed" | xargs)"
          echo "cities=$changed" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "Cities to sync to R2: $changed"
          else
            echo "No schedule data found, skipping R2 sync"
          fi

      - name: Commit processed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update GTFS data [skip ci]'

      - name: Sync schedule data to R2
        if: steps.detect-changes.outputs.cities != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          for city in ${{ steps.detect-changes.outputs.cities }}; do
            if [ -d "$city/schedule" ]; then
              echo "Syncing $city..."
              aws s3 sync --delete "$city/schedule/" "s3://transitrouter-data/$city/schedule/" \
                --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}"
            fi
          done
